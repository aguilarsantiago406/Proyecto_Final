version: '3.9'

services:
  web:
    build: .
    container_name: ghl_mp_backend
    command: bash /entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: ghl_mp_postgres
    restart: always
    environment:
      POSTGRES_DB: ghlmp_db
      POSTGRES_USER: ghluser
      POSTGRES_PASSWORD: ghlpass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
